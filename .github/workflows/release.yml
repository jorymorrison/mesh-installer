name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew :app:assembleDebug --no-daemon

      - name: Prepare Release Assets
        id: prep
        run: |
          mkdir -p release-assets
          # Manual runs use the tag typed into "Run workflow"; tag pushes use the pushed tag.
          VERSION_TAG="${{ github.event.inputs.tag_name }}"
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="${{ github.ref_name }}"
          fi
          if [ -z "$VERSION_TAG" ]; then
            VERSION_TAG="v1.0.0"
          fi
          # Branch names like feature/x would otherwise break the file path below.
          VERSION_TAG="${VERSION_TAG//\//-}"
          cp app/build/outputs/apk/debug/app-debug.apk "release-assets/MeshInstaller-${VERSION_TAG}.apk"
          echo "version_tag=${VERSION_TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.prep.outputs.version_tag }}
          # Tag the commit that was actually built, not the default branch.
          target_commitish: ${{ github.sha }}
          name: "Mesh Installer ${{ steps.prep.outputs.version_tag }}"
          draft: false
          prerelease: false
          files: release-assets/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
